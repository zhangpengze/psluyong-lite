[package]
name = "psluyong-lite"
version = "1.0.0"
description = "PS 模板期刊录用图生成助手"
authors = ["psluyong-lite"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "psluyong_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
