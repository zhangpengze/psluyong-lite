# 绿联 NAS（UGOS Pro）/ 任意 Docker 主机部署 —— 服务端 + 日报推送
#
# 与 napcat 是同一个 NAS 上的两个独立项目。两者通过宿主机端口互通：
# napcat 把容器的 3000 映射到宿主机 13000，
# 本服务通过 host.docker.internal:13000 访问它（extra_hosts 负责把域名指向宿主机）。
#
# 数据全部在 ./data（数据库 / 成品图 / 日报 / 备份），备份这个目录即可。
#
# ⚠ 本目录是「打包源」，不是可直接部署的目录：deploy/nas/ 下没有 Dockerfile 和
#   源码，在这里直接 `docker compose up --build` 会失败。正确路径是在仓库根执行
#   `python scripts/package_nas.py` 打包，zip 解压后的目录才具备完整构建上下文
#   （Dockerfile / requirements.txt / server/ bot/ core/ 都在 zip 根目录）。

services:
  server:
    build: .
    # 版本化 tag：与根 compose 同款，构建时 PSLUYONG_IMAGE_TAG=$(git rev-parse
    # --short HEAD)，回滚指定旧 tag；不设则 latest。见 docs/DEPLOY.md 第五节。
    image: psluyong-lite:${PSLUYONG_IMAGE_TAG:-latest}
    container_name: psluyong-lite
    # NAS 上挂载目录的属主通常不是 1000，容器内 appuser 会写不进去
    # （报 PermissionError: /app/data/images）。用 root 运行避开这个问题。
    user: "0:0"
    # 启动前先把挂载进来的 data 目录权限放开，避免不同 NAS 的属主/ACL 差异
    command: sh -lc "mkdir -p /app/data && chmod -R 777 /app/data 2>/dev/null || true; exec python -m server.run"
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Shanghai}
      # 定时日报/备份调度开关，与根 compose 同款显式声明。Config 里缺省也是 1
      # （缺键不会让日报不跑），写出来是为两份 compose 一致——将来改默认值
      # 不会只影响一边。真漂移修复，勿删。
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-1}
      # 成品图镜像目录（容器内路径）。把 NAS 第二块盘/另一台共享目录挂到
      # /app/mirror，这里就填 /app/mirror；留空 = 不镜像（盘坏即丢图）。
      IMAGES_MIRROR_DIR: ${IMAGES_MIRROR_DIR:-}
    # 让容器内可以解析 host.docker.internal → 宿主机网关，
    # 从而访问宿主机 13000 上跑的 NapCat HTTP 服务（Linux 上默认没有这个域名）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      # 图片镜像目标（可选，配了 IMAGES_MIRROR_DIR=/app/mirror 才需要）
      # - /volume2/backup/psluyong-images:/app/mirror
    # 容器日志限流：默认 json-file 无限增长会吃满 NAS 系统盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # 镜像里没装 curl（精简版 Dockerfile 不跑 apt），用 python 自带 urllib 探活
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health/ready',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
