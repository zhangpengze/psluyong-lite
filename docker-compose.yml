# 绿联 NAS / 任意 Docker 主机部署
#
#   cp .env.example .env   # 填好密钥
#   docker compose up -d --build
#
# 图片与数据库都在 ./server/data，备份这个目录即可。

services:
  server:
    build: .
    # 版本化 tag：构建时带 PSLUYONG_IMAGE_TAG=$(git rev-parse --short HEAD) 即按
    # 提交号落 tag，回滚时指定旧 tag 重启即可；不设则退化为 latest（兼容旧部署）。
    # 打 tag 规范与回退命令见 docs/DEPLOY.md 第五节「回滚」。
    image: psluyong-lite:${PSLUYONG_IMAGE_TAG:-latest}
    container_name: psluyong-lite
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Shanghai}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-1}
      # 成品图镜像目录（容器内路径）：把 NAS 上的另一块盘/共享目录挂到 /app/mirror，
      # 这里填 /app/mirror。留空 = 不镜像（盘坏即丢图，启动日志会 warning）。
      IMAGES_MIRROR_DIR: ${IMAGES_MIRROR_DIR:-}
    volumes:
      # NAS 共享文件夹挂到这里，重装容器不丢数据
      - ./server/data:/app/data
      # 图片镜像目标：宿主机第二块盘 / 另一台 NAS 的挂载点
      # - /volume2/backup/psluyong-images:/app/mirror
    # 容器日志必须限流：json-file 默认无限增长，NAS 系统盘写满会连带
    # 其它容器一起挂，而且没有任何提示。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      # ⚠ 只能跑 1 份（两份 compose 同款）：日报「今天推过没有」是读—发—写三步、
      #   中间无锁，两个副本会各推一遍。见 docs/DEPLOY.md §3.4。
      resources:
        limits:
          cpus: "2"
          memory: 1G
