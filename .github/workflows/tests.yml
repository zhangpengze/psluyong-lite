name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu 覆盖 NAS Docker（POSIX fcntl 备份锁）；
        # windows 覆盖员工机与开发机（msvcrt 备份锁、COM 可选导入）
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # 密钥文件门禁：.env 及其任何变体（.env.local/.env.bak.ci/.env.prod）一律
      # 不得入库，只放行模板。真实事故：为复现「CI 没有 .env」执行
      # cp .env .env.bak.ci，该文件被 git add -A 带进提交并推到公开仓库，
      # SECRET_KEY/API_KEY/ADMIN_PASSWORD/NAPCAT_TOKEN 暴露约 2 分钟。
      - name: Secret file guard
        if: runner.os == 'Linux'
        shell: bash
        run: |
          leaks=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '^\.env\.example$' || true)
          if [ -n "$leaks" ]; then
            echo "以下环境文件被纳入版本控制（禁止，只允许 .env.example）："
            printf '%s\n' "$leaks"
            exit 1
          fi
          echo "密钥文件门禁通过：仓库内无 .env / .env.* 实体文件"
      # 行数门禁：源文件 >300 行即失败。口径 = server/core/bot/client 的
      # py/vue/ts/js（不含 css/tests/scripts，与项目裁决一致）。
      # 只在 Linux 跑一次（矩阵里跑两遍没意义；Windows 侧 find/awk 语义不同）。
      - name: Line count guard (<=300)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out=$(find server core bot client/sidecar client/src -name '*.py' -o -name '*.vue' -o -name '*.ts' -o -name '*.js' | grep -v node_modules | xargs wc -l | awk '$1>300 && $2!="total"' || true)
          if [ -n "$out" ]; then
            echo "以下文件超过 300 行（口径：server/core/bot/client，不含 css/tests/scripts）："
            printf '%s\n' "$out"
            exit 1
          fi
          echo "行数门禁通过：无超过 300 行的源文件"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        # 无超时保护时一次挂死的测试会占满 6 小时 runner 配额
        timeout-minutes: 15
        id: pytest
        continue-on-error: true
        shell: bash
        run: |
          # tee 留一份日志：job 日志需登录才能看，失败时下一步把
          # FAILED/ERROR 行打成注解，外部排障也能拿到失败名单。
          set -o pipefail
          python -m pytest tests -q --tb=short 2>&1 | tee pytest-out.log

      - name: Surface failing tests
        if: steps.pytest.outcome == 'failure'
        shell: bash
        run: |
          echo "pytest 退出码非 0；失败清单（最多 15 条，已打成注解）"
          grep -E "^(FAILED|ERROR) |^E   " pytest-out.log | head -30 | while IFS= read -r line; do
            echo "::error title=pytest failure::$line"
          done
          # 收集期错误（exit 2）未必有 FAILED 行，兜底打印尾部摘要
          tail -30 pytest-out.log
          exit 1

  client:
    # 前端以前完全不在流水线里：vue-tsc / vitest / build 全绿才说明客户端能装出来，
    # 否则改了 .vue 也能让 CI 一片绿，装包时才发现崩了。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
